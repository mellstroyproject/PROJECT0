<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игровой сервер</title>
<style>
:root{color-scheme:dark;--bg:#0f0e17;--panel:#1a1a2a;--panel2:#22223a;--line:#2b2b45;--tx:#f2f2fa;--mut:#8b8ba7;--acc:#4a6cf7;--red:#e5484d;--gold:#f5a524}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border-radius:16px;margin:16px auto;max-width:1280px;padding:10px 16px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-weight:800}
.stat{font-size:12px;color:var(--mut);line-height:1.5}
nav{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
nav button{padding:10px 16px;border-radius:12px;font-weight:600}
nav button.on,nav button:hover{background:var(--panel2)}
.tag{background:var(--red);border-radius:6px;font-size:11px;padding:1px 6px;margin-left:6px}
.right{display:flex;gap:8px;align-items:center;position:relative}
.promo-wrap{position:relative}
.chip{background:var(--panel2);border-radius:12px;padding:10px 14px;font-weight:600}
.steam{background:var(--acc);border-radius:12px;padding:10px 18px;font-weight:700}
.demo{font-size:12px;color:var(--mut);text-decoration:underline}
.ava{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#4a6cf7,#9b5cf6) center/cover no-repeat;border:0}
.promo-btn{background:var(--panel2);border-radius:12px;padding:10px 14px;font-weight:600}
.promo-pop{position:absolute;top:52px;right:0;background:var(--panel2);border-radius:12px;padding:14px;min-width:240px;z-index:6;box-shadow:0 8px 24px #0008;display:flex;flex-direction:column;gap:8px}
.promo-pop input{width:100%}
.promo-pop button{background:var(--acc);border-radius:10px;padding:9px 0;font-weight:700}
.promo-msg{font-size:13px;min-height:16px}
.promo-msg.ok{color:#4ade80}.promo-msg.err{color:var(--red)}
.menu{position:absolute;top:52px;right:0;background:var(--panel2);border-radius:12px;padding:8px;min-width:190px;z-index:5;box-shadow:0 8px 24px #0008}
.menu-role{color:var(--gold);font-size:12px;font-weight:700;padding:6px 12px 4px}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px}
.menu button:hover{background:var(--line)}
.admin-badge{background:var(--gold);color:#1a1200;border-radius:6px;font-size:11px;font-weight:700;padding:2px 8px;margin-left:10px}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
.admin-card{background:var(--panel);border-radius:12px;padding:18px}
.admin-card .n{font-size:26px;font-weight:800}
.admin-card .l{color:var(--mut);font-size:13px;margin-top:4px}
.admin-tools{background:var(--panel);border-radius:12px;padding:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.admin-tools input{flex:1;min-width:200px}
.admin-tools button{background:var(--panel2);border-radius:10px;padding:10px 16px;font-weight:600}
.admin-tools button.danger{background:var(--red)}
main{max-width:1280px;margin:0 auto 60px;padding:0 16px}
h1{font-size:28px;margin:24px 0 20px}
.cards{display:flex;justify-content:center}
.mode{width:min(100%,320px);height:460px;border-radius:16px;background:linear-gradient(180deg,#1c1c2e,#12121e);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:28px;gap:10px;cursor:pointer;transition:transform .2s}
.mode:hover{transform:translateY(-4px)}
.mode b{font-size:40px;letter-spacing:.5px}
.online{background:var(--panel2);border-radius:20px;padding:4px 14px;font-size:13px;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:6px}
table{width:100%;border-collapse:separate;border-spacing:0 8px}
th{font-weight:500;color:var(--mut);font-size:13px;text-align:left;padding:4px 16px}
td{background:var(--panel);padding:14px 16px}
td:first-child{border-radius:12px 0 0 12px}td:last-child{border-radius:0 12px 12px 0}
.tabs{display:inline-flex;background:var(--panel);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.tabs button{padding:9px 18px;border-radius:9px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--panel2);color:var(--tx)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
input{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px 14px;font:inherit;min-width:240px}
.prem{background:var(--acc);border-radius:6px;font-size:11px;font-weight:700;padding:2px 8px;margin-right:8px}
.ban{color:var(--red)}.ok{color:#4ade80}
.plans{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.plan{width:min(100%,360px);border-radius:16px;padding:24px;background:var(--panel);border:1px solid var(--line)}
.plan.p{border-color:var(--acc);background:linear-gradient(180deg,#1b2246,var(--panel))}
.plan.g{border-color:var(--gold);background:linear-gradient(180deg,#3a2c14,var(--panel))}
.plan h2{font-size:26px;margin-bottom:16px}
.plan li{list-style:none;background:#ffffff0d;border-radius:10px;padding:10px 14px;margin-bottom:8px}
.plan li:before{content:"✓";color:var(--acc);margin-right:10px}
.plan.g li:before{color:var(--gold)}
.periods{display:flex;gap:4px;margin:14px 0}
.periods button{flex:1;padding:8px 0;border-radius:8px;background:#ffffff0d;font-size:13px}
.periods button.on{background:var(--acc)}
.price{font-size:26px;font-weight:800;margin-bottom:12px}
.buy{width:100%;padding:12px;border-radius:12px;background:var(--acc);font-weight:700}
.plan.g .buy{background:var(--gold);color:#1a1200}
.rules{display:grid;grid-template-columns:230px 1fr;gap:16px}
.side{background:var(--panel);border-radius:12px;padding:8px;align-self:start}
.side button{display:block;width:100%;text-align:left;padding:12px;border-radius:8px;color:var(--mut)}
.side button.on{background:var(--panel2);color:var(--tx)}
.empty{background:var(--panel);border-radius:12px;padding:28px;color:var(--mut)}
.join{background:var(--acc);border-radius:10px;padding:8px 16px;font-weight:600}
@media(max-width:760px){.rules{grid-template-columns:1fr}nav{justify-content:flex-start}}

/* ===== анимации ===== */
:root{--ease:cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tick{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bump{40%{transform:scale(1.14);background:var(--acc)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #4a6cf799}70%,100%{box-shadow:0 0 0 9px #4a6cf700}}
@keyframes drift{to{transform:translate3d(5%,4%,0) scale(1.1)}}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
 background:radial-gradient(40% 40% at 20% 20%,#4a6cf722,transparent 70%),radial-gradient(35% 35% at 80% 30%,#9b5cf61c,transparent 70%),radial-gradient(40% 40% at 50% 95%,#f5a52412,transparent 70%);
 animation:drift 26s ease-in-out infinite alternate}
header{animation:drop .8s var(--ease) backwards}
button,.chip,.steam,.join,.promo-btn{transition:background .3s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease),color .25s,opacity .25s}
button:active{transform:scale(.96)!important}
nav button:hover{transform:translateY(-1px)}
.logo{transition:transform .6s var(--ease)}.logo:hover{transform:rotate(-10deg) scale(1.1)}
.ava{transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.ava:hover{transform:scale(1.08);box-shadow:0 0 0 3px #4a6cf766}
.steam:hover,.promo-btn:hover,.join:hover{transform:translateY(-2px);box-shadow:0 8px 22px #4a6cf744}
.promo-btn:hover{background:var(--line)}
.chip.bump{animation:bump .7s var(--ease)}
.price.tick{animation:tick .45s var(--ease)}
input{transition:border-color .25s,box-shadow .25s,background .25s}
input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px #4a6cf733}
.mode{transition:transform .45s var(--ease),border-color .35s,box-shadow .45s var(--ease)}
.mode:hover{transform:translateY(-8px);border-color:var(--acc);box-shadow:0 24px 60px #4a6cf733}
.dot{animation:pulse 2s ease-out infinite}
.plan{transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.plan:hover{transform:translateY(-6px);box-shadow:0 20px 44px #4a6cf722}
.plan.g:hover{box-shadow:0 20px 44px #f5a52422}
.plan li{transition:transform .3s var(--ease),background .3s}
.plan li:hover{transform:translateX(5px);background:#ffffff18}
.buy:hover{transform:translateY(-2px);box-shadow:0 10px 26px #4a6cf755}
.plan.g .buy:hover{box-shadow:0 10px 26px #f5a52455}
td{transition:background .3s var(--ease)}
tr:hover td{background:var(--panel2)}
.side button{transition:background .3s var(--ease),color .25s,transform .3s var(--ease)}
.side button:hover{transform:translateX(3px);color:var(--tx)}
.menu button:hover{transform:translateX(3px)}
.pop{animation:pop .3s var(--ease);transform-origin:top right}
#app.enter h1{animation:rise .6s var(--ease) backwards}
#app.enter :is(tr,.plan,.mode,.admin-card,.admin-tools,.bar,.side,.empty,.stat){animation:rise .65s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms + 70ms)}
#right.swap>*{animation:rise .55s var(--ease) backwards}
#right.swap>*:nth-child(2){animation-delay:.07s}#right.swap>*:nth-child(3){animation-delay:.14s}#right.swap>*:nth-child(4){animation-delay:.21s}#right.swap>*:nth-child(5){animation-delay:.28s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.ava{color:#fff;font-weight:800;font-size:16px}

.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button,.promo-btn,.steam{display:inline-flex;align-items:center;gap:8px}
nav button .ic{opacity:.7;transition:opacity .25s}
nav button.on .ic,nav button:hover .ic{opacity:1}
.promo-btn.gold{color:var(--gold)}
.chip.bal{display:inline-flex;align-items:center;gap:8px;padding:5px 5px 5px 12px}
.chip.bal .ic{color:#7c93ff}
.plus{width:28px;height:28px;border-radius:8px;background:#4a6cf733;color:#9fb0ff;font-weight:700;line-height:1;font-size:16px}
.plus:hover{background:var(--acc);color:#fff}
.menu{min-width:180px;padding:6px}
.menu button{display:flex;align-items:center;gap:10px;color:#cfcfe6;font-size:14px}
.menu button:hover{color:#fff}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.steam .ic{width:18px;height:18px}

.sec{font-size:20px;margin:30px 0 12px}
select{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px #4a6cf733}
.admin-tools button.ok{background:var(--acc)}
.admin-tools .promo-msg{width:100%}
.admin-tools input[type=number]{min-width:150px;flex:0 1 200px}
.lnk{color:#9fb0ff;text-decoration:none}.lnk:hover{text-decoration:underline}
.join.del{background:#e5484d33;color:#ff8a8e}.join.del:hover{background:var(--red);color:#fff}
</style>
</head>
<body>
<header>
  <div class="logo">S</div>
  <div class="stat">Админов: 37<br>Игроков: 376</div>
  <nav id="nav"></nav>
  <div class="right" id="right"></div>
</header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const reduce=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const prev={menu:false,promo:false,logged:false,coins:null,key:''};
function countTo(from,to){
  const t0=performance.now(),d=800;
  const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3),el=$('#bal');
    if(el)el.textContent=(from+(to-from)*e).toFixed(2);
    if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function setPeriod(k,i,btn){
  st.plan[k]=i;
  const plan=btn.closest('.plan');
  plan.querySelectorAll('.periods button').forEach((b,j)=>b.classList.toggle('on',j===i));
  const p=plan.querySelector('.price');
  p.textContent=price[k][i]+' ₽';
  p.classList.remove('tick');void p.offsetWidth;p.classList.add('tick');
}
const st={page:'home',lb:'exp',bt:'bans',plan:{prem:0,plus:0},rule:0,user:null,menu:false,promoOpen:false,promo:'',promoMsg:null};

// Промокоды: временный список для примера, лучше хранить и проверять на сервере,
// иначе любой посмотрит код прямо в исходнике страницы.
const PROMO_CODES={
  'START100':{coins:100,text:'+100 монет'},
  'WELCOME50':{coins:50,text:'+50 монет'},
  'MELLSTROYPROJECT':{coins:200,text:'+200 монет'}
};
const usedPromoKey='usedPromoCodes';
function getUsedPromo(){try{return JSON.parse(localStorage.getItem(usedPromoKey)||'[]')}catch(e){return []}}
function togglePromo(){st.promoOpen=!st.promoOpen;st.menu=false;st.promoMsg=null;draw()}
function buyPlan(key,name){
  if(!st.user){alert('Сначала войдите через Steam, чтобы купить');return}
  const cost=price[key][st.plan[key]];
  const bal=st.user.coins||0;
  if(bal<cost){alert(`Недостаточно средств: не хватает ${(cost-bal).toFixed(2)} ₽. Пополните баланс или используйте промокод.`);return}
  st.user.coins=bal-cost;
  if(key==='plus'){
    const until=Math.max(Date.now(),getPlusUntil(st.user.id))+PERIOD_DAYS[st.plan[key]]*864e5;
    try{localStorage.setItem('plusUntil:'+st.user.id,String(until))}catch(e){}
    applyRole(st.user);
  }
  alert(`Покупка успешна: ${name} на ${periods[st.plan[key]]}`+(key==='plus'?'. Рядом с промокодом появилась кнопка «Админ-панель».':''));
  draw();
}
function activatePromo(){
  if(!st.user){st.promoMsg={ok:false,text:'Сначала войдите через Steam'};draw();return}
  const code=st.promo.trim().toUpperCase();
  const fail=t=>{st.promoMsg={ok:false,text:t};draw()};
  if(!code)return fail('Введите код');
  const found=allPromos()[code];
  if(!found)return fail('Код не найден');
  const usedKey='usedPromoCodes:'+st.user.id,used=LS.get(usedKey,[]);
  if(used.includes(code))return fail('Этот код уже был использован');
  if(found.max>0&&(found.used||0)>=found.max)return fail('Лимит активаций этого кода исчерпан');
  st.user.coins=(st.user.coins||0)+found.coins;
  used.push(code);LS.set(usedKey,used);
  if(!found.builtin){const list=getCustomPromos(),p=list.find(x=>x.code===code);if(p){p.used=(p.used||0)+1;LS.set('customPromos',list)}}
  st.promo='';
  st.promoMsg={ok:true,text:'Код активирован: +'+found.coins+' монет'};
  draw();
}
// Владелец сервера: этот SteamID64 всегда получает права главного админа.
// https://steamcommunity.com/profiles/76561198659672678
const OWNER_STEAM_ID='76561198659672678';
const PERIOD_DAYS=[7,30,90,180];
const FOREVER=1e15; // «навсегда» для выданной админки
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function getGrants(){return LS.get('adminGrants',{})}
function getGrantUntil(id){const g=getGrants()[id];return g?+g.until||0:0}
function getCustomPromos(){return LS.get('customPromos',[])}
function allPromos(){ // встроенные + созданные в админ-панели
  const m={};
  for(const c in PROMO_CODES)m[c]={code:c,coins:PROMO_CODES[c].coins,max:0,used:0,builtin:true};
  for(const p of getCustomPromos())m[p.code]=p;
  return m;
}
const fmtDate=t=>t>=FOREVER?'навсегда':new Date(t).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'});
function getPlusUntil(id){try{return +localStorage.getItem('plusUntil:'+id)||0}catch(e){return 0}}
const DEFAULT_AVATAR_HASH='b5bd56c1aa4644a474a2e4972be27ef9e82e517e'; // стандартная «?» аватарка Steam
function safeAvatar(a){
  return typeof a==='string'&&!a.includes(DEFAULT_AVATAR_HASH)&&/^https:\/\/[\w.-]+\.(steamstatic\.com|akamaihd\.net)\/[\w\-./]+$/i.test(a)?a:null;
}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function applyRole(u){
  u.avatar=safeAvatar(u.avatar);
  u.isOwner=u.id===OWNER_STEAM_ID;
  u.plusUntil=Math.max(getPlusUntil(u.id),getGrantUntil(u.id));
  u.hasPlus=u.plusUntil>Date.now();
  u.isAdmin=u.isOwner||u.hasPlus;
  u.role=u.isOwner?'Владелец':(u.hasPlus?'Админ+':null);
  return u;
}

const ICONS={
 play:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',
 shop:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 8H6"/>',
 leaders:'<path d="M6 20v-9M12 20V4M18 20v-6"/>',
 bans:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
 rules:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
 promo:'<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/>',
 coin:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 skin:'<path d="M4 20l6-6M14 4l6 6-8 8-6-6z"/>',
 box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 steam:'<circle cx="15.5" cy="8.5" r="4.5"/><circle cx="8" cy="16" r="3" fill="currentColor"/><path d="M8.5 15.5l4.5-4"/>'
};
const I=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const PAGES=[['home','Играть','play'],['shop','Магазин','shop'],['leaders','Лидеры','leaders'],['bans','Баны','bans'],['rules','Правила','rules']];

// Steam: если Steam вернул пользователя с openid-параметрами, читаем SteamID.
// ВАЖНО: проверить подпись (openid.sig) нужно на сервере, иначе вход можно подделать.
try{const q=new URLSearchParams(location.search),c=q.get('openid.claimed_id');
 if(c&&/\/openid\/id\/(\d+)$/.test(c)){
   st.user=applyRole({id:RegExp.$1,name:'Игрок',coins:15,avatar:null});
   try{history.replaceState(null,'',location.pathname)}catch(e){} // убираем openid-параметры из адреса
   // OpenID отдаёт только SteamID64, но не имя и не аватарку.
   // Чтобы получить реальную аватарку, нужен запрос на backend, который
   // сам сходит в Steam Web API (ISteamUser/GetPlayerSummaries) со своим
   // ключом — из браузера так сделать нельзя (ключ светился бы всем, и Steam
   // не пускает такие запросы через CORS). Пример:
 }}catch(e){}

// Сохранённый аккаунт: после перезагрузки страницы пользователь остаётся в системе.
const ACC_KEY='account';
try{
  const saved=JSON.parse(localStorage.getItem(ACC_KEY)||'null');
  if(saved&&saved.id){
    if(!st.user) st.user=applyRole(saved);
    else if(st.user.id===saved.id){ // вернулись из Steam тем же аккаунтом — оставляем баланс и аватарку
      st.user.coins=saved.coins;
      if(saved.name&&saved.name!=='Игрок')st.user.name=saved.name;
      st.user.avatar=st.user.avatar||saved.avatar;
      applyRole(st.user);
    }
  }
}catch(e){}
function saveUser(){
  try{
    if(st.user)localStorage.setItem(ACC_KEY,JSON.stringify({id:st.user.id,name:st.user.name,coins:st.user.coins,avatar:st.user.avatar||null}));
    else localStorage.removeItem(ACC_KEY);
  }catch(e){}
}

// Аватарка и ник из Steam. OpenID отдаёт только SteamID, поэтому профиль берём отдельно:
// 1) со своего backend (/api/steam-profile) — лучший вариант, когда сайт лежит на хостинге;
// 2) иначе — публичная XML-страница профиля Steam через CORS-прокси (работает и из локального файла).
const avatarTried={};
async function getWithTimeout(url,ms){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return r}finally{clearTimeout(t)}
}
function parseSteamXml(x){
  const g=tag=>{const m=x.match(new RegExp('<'+tag+'>\\s*(?:<!\\[CDATA\\[)?\\s*([\\s\\S]*?)\\s*(?:\\]\\]>)?\\s*</'+tag+'>'));return m?m[1]:null};
  return {avatar:g('avatarFull'),name:g('steamID')};
}
async function loadSteamAvatar(){
  const u=st.user;
  if(!u||u.avatar||!/^\d{17}$/.test(u.id)||avatarTried[u.id])return;
  avatarTried[u.id]=true;
  let info=null;
  try{
    if(location.protocol.startsWith('http')){info=await (await getWithTimeout('/api/steam-profile?steamid='+u.id,4000)).json()}
  }catch(e){}
  if(!info||!safeAvatar(info.avatar)){
    const xml='https://steamcommunity.com/profiles/'+u.id+'?xml=1';
    const proxies=[x=>'https://api.allorigins.win/raw?url='+encodeURIComponent(x),x=>'https://corsproxy.io/?'+encodeURIComponent(x)];
    for(const p of proxies){
      try{
        const r=parseSteamXml(await (await getWithTimeout(p(xml),8000)).text());
        if(safeAvatar(r.avatar&&r.avatar.replace(/^http:/,'https:'))){info={avatar:r.avatar.replace(/^http:/,'https:'),name:r.name};break}
      }catch(e){}
    }
  }
  const av=info&&safeAvatar(info.avatar);
  if(av&&st.user&&st.user.id===u.id){
    st.user.avatar=av;
    if(info.name&&typeof info.name==='string')st.user.name=info.name.slice(0,32);
    draw();
  }else avatarTried[u.id]=false; // не вышло — попробуем при следующем входе/загрузке
}
function demoLogin(){st.user=applyRole({id:OWNER_STEAM_ID,name:'Демо',coins:15,avatar:null});draw();loadSteamAvatar()}

function steamLogin(){
  if(!location.protocol.startsWith('http')){
    alert('Вход через Steam работает, только когда сайт открыт по адресу http(s):// — из файла на компьютере Steam не сможет вернуть вас обратно.\n\nДля проверки запустите в папке с index.html команду:\npython -m http.server 8000\nи откройте http://localhost:8000\n\nПока можно нажать «демо».');
    return;
  }
  const p=new URLSearchParams({'openid.ns':'http://specs.openid.net/auth/2.0','openid.mode':'checkid_setup',
   'openid.return_to':location.origin+location.pathname,'openid.realm':location.origin,
   'openid.identity':'http://specs.openid.net/auth/2.0/identifier_select','openid.claimed_id':'http://specs.openid.net/auth/2.0/identifier_select'});
  location.href='https://steamcommunity.com/openid/login?'+p;
}
function logout(){st.user=null;st.menu=false;st.promoOpen=false;draw()}

 drop:[['Игрок 6','128','—','—','310 ч.'],['Игрок 7','97','—','—','254 ч.'],['Игрок 8','85','—','—','402 ч.']]};

const plus=['Все возможности премиума','Заглушить игрока','Заморозить игрока','Ослепить игрока','Убить игрока','Изменить урон игроку','Изменить здоровье игроку','Отключить прыжок игроку'];

function head(){
  const nav=$('#nav');
  if(!nav.children.length) nav.innerHTML=PAGES.map(([k,t,ic])=>`<button data-k="${k}" onclick="go('${k}')">${I(ic)}${t}${k==='shop'?'<span class="tag">-50%</span>':''}</button>`).join('');
  [...nav.children].forEach(b=>{const k=b.dataset.k;b.classList.toggle('on',st.page===k||(k==='home'&&st.page==='public'))});
  const logged=!!st.user,coins=logged?(st.user.coins||0):0,from=prev.coins;
  const menuFresh=st.menu&&!prev.menu,promoFresh=st.promoOpen&&!prev.promo;
  const coinsChanged=logged&&prev.logged&&from!==null&&coins!==from,loginChanged=logged!==prev.logged;
  prev.menu=st.menu;prev.promo=st.promoOpen;prev.logged=logged;prev.coins=logged?coins:null;
  $('#right').classList.toggle('swap',loginChanged);
  const menuItems=(st.user&&st.user.isAdmin?[['Админ-панель','shield',"go('admin')"]]:[]).concat([['Профиль','user'],['Скинченджер','skin'],['Хранилище','box'],['Настройки','gear']]);
  $('#right').innerHTML=st.user?
   `<div class="promo-wrap"><button class="promo-btn" onclick="togglePromo()">${I('promo')}Промокод</button>`+
   (st.promoOpen?`<div class="promo-pop${promoFresh?' pop':''}"><input value="${esc(st.promo)}" oninput="st.promo=this.value" onkeydown="if(event.key==='Enter')activatePromo()" placeholder="Введите код" aria-label="Промокод" autofocus><button onclick="activatePromo()">Активировать</button><div class="promo-msg ${st.promoMsg?(st.promoMsg.ok?'ok':'err'):''}">${st.promoMsg?st.promoMsg.text:''}</div></div>`:'')+
   `</div>`+
   (st.user.isAdmin?`<button class="promo-btn gold" onclick="go('admin')">${I('shield')}Админ-панель</button>`:'')+
   `<div class="chip bal${coinsChanged?' bump':''}">${I('coin')}<span id="bal">${coins.toFixed(2)}</span><button class="plus" aria-label="Пополнить баланс" onclick="alert('Пополнение баланса пока не подключено — платёжную систему добавим позже.')">+</button></div>`+
   `<button class="ava" aria-label="Профиль" style="${st.user.avatar?`background-image:url('${st.user.avatar}')`:''}" onclick="st.menu=!st.menu;st.promoOpen=false;head()">${st.user.avatar?'':esc((st.user.name||'?').trim().charAt(0).toUpperCase())}</button>`+
   (st.menu?`<div class="menu${menuFresh?' pop':''}">${st.user.role?`<div class="menu-role">${st.user.role}</div>`:''}${menuItems.map(([t,ic,act])=>`<button onclick="${act||'st.menu=false;head()'}">${I(ic)}${t}</button>`).join('')}<hr><button onclick="logout()">${I('out')}Выйти</button></div>`:'')
   :`<button class="steam" onclick="steamLogin()">${I('steam')}Войти через Steam</button><a class="demo" href="#" onclick="demoLogin();return false">демо</a>`;
  if(coinsChanged&&!reduce)countTo(from,coins);
}
function view(){
  if(st.page==='admin'&&!(st.user&&st.user.isAdmin)){st.page='home'}
  if(st.page==='home') return `<div class="cards"><div class="mode" onclick="go('public')" role="button" tabindex="0"><b>PUBLIC</b><span class="online">Онлайн: 256<i class="dot"></i></span></div></div>`;
  if(st.page==='public') return `<h1>Public: серверы</h1><table><tr><th>Сервер</th><th>Карта</th><th>Игроки</th><th>Пинг</th><th></th></tr>${servers.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}/${s[3]}</td><td>${s[4]} мс</td><td><button class="join" onclick="alert('Здесь будет подключение: steam://connect/IP:порт')">Играть</button></td></tr>`).join('')}</table><p class="stat">Адреса и названия серверов временные.</p>`;
  if(st.page==='shop') return `<h1 style="text-align:center">Магазин</h1><div class="plans">${[['prem','Премиум',prem,'p'],['plus','Админ+',plus,'g']].map(([k,n,l,c])=>`<div class="plan ${c}"><h2>${n}</h2><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul><div class="periods">${periods.map((p,i)=>`<button class="${st.plan[k]===i?'on':''}" onclick="setPeriod('${k}',${i},this)">${p}</button>`).join('')}</div><div class="price">${price[k][st.plan[k]]} ₽</div><button class="buy" onclick="buyPlan('${k}','${n}')">Купить</button></div>`).join('')}</div>`;
  if(st.page==='leaders'){const rows=leaders[st.lb];return `<h1>Лидеры</h1><div class="bar"><div class="tabs"><button class="${st.lb==='exp'?'on':''}" onclick="st.lb='exp';draw()">По опыту</button><button class="${st.lb==='drop'?'on':''}" onclick="st.lb='drop';draw()">По дропу</button></div><input placeholder="Поиск по нику / SteamID..." aria-label="Поиск"></div><table><tr><th>Место</th><th>Игрок</th><th>Очков</th><th>Убийств</th><th>У/С</th><th>Время игры</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${i<2&&st.lb==='exp'?'<span class="prem">ПРЕМИУМ</span>':''}${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</table>`}
  if(st.page==='bans'){const rows=st.bt==='bans'?bans:mutes;return `<h1>Баны</h1><div class="bar"><div class="tabs"><button class="${st.bt==='bans'?'on':''}" onclick="st.bt='bans';draw()">Баны</button><button class="${st.bt==='mutes'?'on':''}" onclick="st.bt='mutes';draw()">Муты</button></div><input placeholder="Поиск по нику / SteamID..." aria-label="Поиск"></div><table><tr><th>Игрок</th><th>Админ</th><th>Причина</th><th>Статус</th><th>Срок</th><th>Дата</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="${r[3]?'ban':'ok'}">${r[3]?(st.bt==='bans'?'Забанен':'Замучен'):'Разбанен'}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join('')}</table>`}
  if(st.page==='rules') return `<h1>Правила</h1><div class="rules"><div class="side">${rcats.map((c,i)=>`<button class="${st.rule===i?'on':''}" onclick="st.rule=${i};draw()">${c}</button>`).join('')}</div><div class="empty">Раздел «${rcats[st.rule]}»: текст правил добавим позже.</div></div>`;
  if(st.page==='admin') return `<h1>Админ-панель<span class="admin-badge">${st.user.role}</span></h1>
   <div class="admin-grid">
     <div class="admin-card"><div class="n">376</div><div class="l">Игроков онлайн</div></div>
     <div class="admin-card"><div class="n">37</div><div class="l">Админов в сети</div></div>
     <div class="admin-card"><div class="n">${bans.filter(b=>b[3]).length}</div><div class="l">Активных банов</div></div>
     <div class="admin-card"><div class="n">${mutes.filter(m=>m[3]).length}</div><div class="l">Активных мутов</div></div>
   </div>
   <div class="admin-tools"><input id="adminTarget" placeholder="Ник или SteamID игрока" aria-label="Игрок">
     ${(st.user.isOwner?[['Кикнут','Кикнуть'],['Замьючен','Замьютить'],['Заглушен','Заглушить'],['Заморожен','Заморозить'],['Ослеплён','Ослепить'],['Убит','Убить']]:[['Заглушен','Заглушить'],['Заморожен','Заморозить'],['Ослеплён','Ослепить'],['Убит','Убить']]).map(([v,t])=>`<button onclick="adminAction('${v}')">${t}</button>`).join('')}
     ${st.user.isOwner?`<button class="danger" onclick="adminAction('Забанен')">Забанить</button>`:''}
   </div>
   ${st.user.isOwner?adminOwnerSections():''}
   <p class="stat">Панель — заготовка для интерфейса: реальные баны/муты/кики нужно подключить к серверу игры и базе данных.</p>`;
}
function adminMsgNow(id,text){const e=$(id);if(e){e.textContent=text;e.className='promo-msg err'}}
function adminOk(kind,text){st.adminMsg={[kind]:{ok:true,text}};draw()}
function grantAdmin(){
  if(!(st.user&&st.user.isOwner))return;
  const id=($('#grantId').value||'').trim(),sel=$('#grantDays').value;
  if(!/^\d{17}$/.test(id))return adminMsgNow('#grantMsg','SteamID64 — это 17 цифр (например 76561198…)');
  if(id===OWNER_STEAM_ID)return adminMsgNow('#grantMsg','Этот игрок уже владелец');
  const g=getGrants(),cur=g[id]?+g[id].until:0,base=Math.max(Date.now(),cur<FOREVER?cur:0);
  g[id]={until:sel==='0'?FOREVER:base+(+sel)*864e5,by:st.user.id,at:Date.now()};
  LS.set('adminGrants',g);
  if(st.user.id===id)applyRole(st.user);
  adminOk('grant','Админка выдана: '+id+' — '+(sel==='0'?'навсегда':sel+' дн.'));
}
function revokeAdmin(id){
  if(!(st.user&&st.user.isOwner)||!/^\d{17}$/.test(id))return;
  const g=getGrants();delete g[id];LS.set('adminGrants',g);
  if(st.user.id===id)applyRole(st.user);
  adminOk('grant','Админка снята: '+id);
}
function genPromo(){
  const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';
  for(let i=0;i<8;i++)c+=a[Math.floor(Math.random()*a.length)];
  $('#pCode').value='PROMO-'+c;
}
function createPromo(){
  if(!(st.user&&st.user.isOwner))return;
  const code=($('#pCode').value||'').trim().toUpperCase(),coins=+$('#pCoins').value,max=Math.floor(+$('#pMax').value||0);
  if(!/^[A-Z0-9_-]{3,24}$/.test(code))return adminMsgNow('#promoMsgA','Код: 3–24 символа — латиница, цифры, _ или -');
  if(!(coins>0&&coins<=100000))return adminMsgNow('#promoMsgA','Награда: число от 1 до 100 000');
  if(max<0||max>1000000)return adminMsgNow('#promoMsgA','Лимит активаций: от 0 (без лимита) до 1 000 000');
  if(allPromos()[code])return adminMsgNow('#promoMsgA','Такой код уже существует');
  const list=getCustomPromos();
  list.push({code,coins,max,used:0,by:st.user.id,at:Date.now()});LS.set('customPromos',list);
  adminOk('promo','Промокод создан: '+code+' (+'+coins+' монет)');
}
function deletePromo(code){
  if(!(st.user&&st.user.isOwner)||!/^[A-Z0-9_-]{3,24}$/.test(code))return;
  LS.set('customPromos',getCustomPromos().filter(p=>p.code!==code));
  adminOk('promo','Промокод удалён: '+code);
}
function adminOwnerSections(){
  const m=st.adminMsg||{},now=Date.now();
  const msg=(k,id)=>`<div id="${id}" class="promo-msg ${m[k]?(m[k].ok?'ok':'err'):''}">${m[k]?esc(m[k].text):''}</div>`;
  const grants=Object.entries(getGrants()).sort((a,b)=>b[1].at-a[1].at);
  const promos=Object.values(allPromos());
  return `<h2 class="sec">Выдать админку</h2>
   <div class="admin-tools"><input id="grantId" placeholder="SteamID64 игрока (17 цифр)" inputmode="numeric" maxlength="17" aria-label="SteamID64">
     <select id="grantDays" aria-label="Срок"><option value="7">7 дней</option><option value="30" selected>30 дней</option><option value="90">90 дней</option><option value="180">180 дней</option><option value="0">Навсегда</option></select>
     <button class="ok" onclick="grantAdmin()">Выдать</button>${msg('grant','grantMsg')}</div>
   ${grants.length?`<table><tr><th>Игрок (SteamID64)</th><th>Роль</th><th>Действует до</th><th></th></tr>${grants.map(([id,g])=>`<tr><td><a class="lnk" href="https://steamcommunity.com/profiles/${id}" target="_blank" rel="noopener">${id}</a></td><td>Админ+</td><td class="${+g.until>now?'ok':'ban'}">${+g.until>now?fmtDate(+g.until):'истёк '+fmtDate(+g.until)}</td><td><button class="join del" onclick="revokeAdmin('${id}')">Снять</button></td></tr>`).join('')}</table>`:'<div class="empty">Пока никому не выдано.</div>'}
   <h2 class="sec">Промокоды</h2>
   <div class="admin-tools"><input id="pCode" placeholder="Код (например SUMMER100)" maxlength="24" aria-label="Код">
     <button onclick="genPromo()">Случайный</button>
     <input id="pCoins" type="number" min="1" max="100000" placeholder="Награда, монет" aria-label="Награда">
     <input id="pMax" type="number" min="0" placeholder="Лимит активаций (0 = без лимита)" aria-label="Лимит">
     <button class="ok" onclick="createPromo()">Создать</button>${msg('promo','promoMsgA')}</div>
   <table><tr><th>Код</th><th>Награда</th><th>Активаций</th><th></th></tr>${promos.map(p=>`<tr><td>${p.code}</td><td>+${p.coins}</td><td>${p.used||0}${p.max?' / '+p.max:' / ∞'}</td><td>${p.builtin?'<span class="stat">встроенный</span>':`<button class="join del" onclick="deletePromo('${p.code}')">Удалить</button>`}</td></tr>`).join('')}</table>`;
}
function adminAction(verb){
  const t=($('#adminTarget')?.value||'').trim();
  if(!t){alert('Укажите ник или SteamID игрока');return}
  alert(`${t}: ${verb.toLowerCase()}`);
}
function draw(){
  saveUser();
  head();
  const app=$('#app'),html=view(),key=st.page+'|'+st.lb+'|'+st.bt+'|'+st.rule,changed=key!==prev.key;
  prev.key=key;
  app.classList.toggle('enter',changed);
  app.innerHTML=html;
  if(changed)app.querySelectorAll('tr,.plan,.mode,.admin-card,.admin-tools,.bar,.side,.empty,.stat').forEach((e,i)=>e.style.setProperty('--i',Math.min(i,14)));
}
draw();
loadSteamAvatar();
